<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>CIO Énergie — Le Souffle</title>
    <script src="vendor/gsap.min.js"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: #02040a;

      #root {
        position: relative;
        width: 100%;

      #film {
        position: absolute;
        left: 0;

      }
      #grade {
        position: absolute;
        inset: 0;
        background: radial-gradient(ellipse at 50% 50%, rgba(2, 4, 10, 0) 55%, rgba(2, 4, 10, 0.7) 100%);
      }
      .clip {
        position: absolute;
        inset: 0;
      }
      .sub {
        position: absolute;
        left: 0;

        bottom: 96px;
        text-align: center;
        font-family: "Montserrat", sans-serif;

        font-size: 44px;
        letter-spacing: 0.03em;
        color: #f3f8ff;
        text-shadow: 0 0 18px rgba(2, 4, 10, 0.95), 0 2px 6px rgba(2, 4, 10, 0.9);
      }
      .sub em {
        font-style: normal;

      }
      #brand {
        position: absolute;

      #brand-cio {
        display: block;
        font-family: "Montserrat", sans-serif;

      #brand-energie {
        display: block;

      #tagline {

      }
      #flash {
        position: absolute;
        inset: 0;
        background: #fff8e6;
        opacity: 0;
      }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="45" data-width="1920" data-height="1080">
      <canvas id="film" width="1920" height="1080"></canvas>
      <div id="grade"></div>

      <!-- on-screen captions (sound-off viewing) -->
      <section class="clip" data-start="6.7" data-duration="2.3" data-track-index="2"><div class="sub" id="c1">Tout commence… par un <em>souffle.</em></div></section>
      <section class="clip" data-start="14.6" data-duration="1.4" data-track-index="2"><div class="sub" id="c2">Le vent.</div></section>
      <section class="clip" data-start="16.3" data-duration="1.5" data-track-index="2"><div class="sub" id="c3">La lumière.</div></section>
      <section class="clip" data-start="18.1" data-duration="1.4" data-track-index="2"><div class="sub" id="c4">L’eau.</div></section>
      <section class="clip" data-start="20.8" data-duration="2.1" data-track-index="2"><div class="sub" id="c5">Des forces immenses…</div></section>
      <section class="clip" data-start="27.0" data-duration="2.0" data-track-index="2"><div class="sub" id="c6">… enfin <em>maîtrisées.</em></div></section>
      <section class="clip" data-start="35.6" data-duration="3.5" data-track-index="2"><div class="sub" id="c7">La plus grande force du monde… tient dans un <em>souffle.</em></div></section>

      <section class="clip" data-start="40.4" data-duration="4.6" data-track-index="3">
        <div id="brand">
          <span id="brand-cio">CIO</span>
          <span id="brand-energie">ÉNERGIE</span>
        </div>
        <div id="tagline">La force de respirer demain.</div>
      </section>

      <div id="flash"></div>

      <audio id="score" src="assets/audio/score.wav" data-start="0" data-duration="45" data-track-index="6" data-volume="0.8"></audio>
      <audio id="vo1" src="assets/vo/v1.wav" data-start="6.7" data-duration="1.94" data-track-index="7" data-volume="1"></audio>
      <audio id="vo2" src="assets/vo/v2.wav" data-start="14.6" data-duration="1.04" data-track-index="7" data-volume="1"></audio>
      <audio id="vo3" src="assets/vo/v3.wav" data-start="16.3" data-duration="1.26" data-track-index="7" data-volume="1"></audio>
      <audio id="vo4" src="assets/vo/v4.wav" data-start="18.1" data-duration="0.83" data-track-index="7" data-volume="1"></audio>
      <audio id="vo5" src="assets/vo/v5.wav" data-start="20.8" data-duration="1.70" data-track-index="7" data-volume="1"></audio>
      <audio id="vo6" src="assets/vo/v6.wav" data-start="27.0" data-duration="1.47" data-track-index="7" data-volume="1"></audio>
      <audio id="vo7" src="assets/vo/v7.wav" data-start="35.6" data-duration="3.24" data-track-index="7" data-volume="1"></audio>
      <audio id="vo8" src="assets/vo/v8.wav" data-start="40.6" data-duration="1.36" data-track-index="7" data-volume="1"></audio>
      <audio id="vo9" src="assets/vo/v9.wav" data-start="42.4" data-duration="1.94" data-track-index="7" data-volume="1"></audio>
    </div>

    <script>
      (function () {
        const tl = gsap.timeline({ paused: true });
        const W = 1920,
          H = 1080,
          DUR = 45;
        const cv = document.getElementById("film");
        const ctx = cv.getContext("2d");

        // ---------- utils ----------
        let seed = 4507;
        const rand = () => {
          seed = (seed + 0x6d2b79f5) | 0;
          let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
          t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
          return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
        };
        const clamp = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v));
        const smooth = (a, b, v) => {
          const x = clamp((v - a) / (b - a));
          return x * x * (3 - 2 * x);
        };
        const lerp = (a, b, k) => a + (b - a) * k;
        const easeOut = (k) => 1 - Math.pow(1 - clamp(k), 3);
        const easeIn = (k) => Math.pow(clamp(k), 3);
        const C = { night: "#050b1d", deep: "#0a1a3f", blue: "#1f4fa0", cyan: "#6fd3ff", gold: "#f5b843", white: "#eaf3ff" };

        function vgrad(stops) {
          const g = ctx.createLinearGradient(0, 0, 0, H);
          stops.forEach(([o, c]) => g.addColorStop(o, c));
          return g;
        }
        function sky(stops) {
          ctx.fillStyle = vgrad(stops);
          ctx.fillRect(0, 0, W, H);
        }
        function glow(x, y, r, color, a) {
          const g = ctx.createRadialGradient(x, y, 0, x, y, r);
          g.addColorStop(0, color.replace("A", a.toFixed(3)));
          g.addColorStop(1, color.replace("A", "0"));
          ctx.fillStyle = g;
          ctx.fillRect(x - r, y - r, r * 2, r * 2);
        }

        // ---------- shared assets ----------
        const ridges = [0, 1, 2, 3].map((i) => {
          const comps = [];
          for (let k = 0; k < 5; k++) comps.push({ f: 0.0012 * (k + 1) * (1 + rand() * 0.6), a: (60 - i * 8) / (k + 1) * (0.7 + rand() * 0.6), p: rand() * 6.28 });
          return { base: 560 + i * 95, comps, col: ["#3d63a3", "#27467d", "#172d57", "#0a1733"][i] };
        });
        const ridgeY = (r, x) => r.base - r.comps.reduce((s, c) => s + c.a * Math.sin(x * c.f + c.p), 0);

        function mountains(z, alpha, mistShift) {
          ctx.save();
          ctx.globalAlpha = alpha;
          ctx.translate(W / 2, H * 0.55);
          ctx.scale(z, z);
          ctx.translate(-W / 2, -H * 0.55);
          ridges.forEach((r, i) => {
            ctx.fillStyle = r.col;
            ctx.beginPath();
            ctx.moveTo(-400, H + 400);
            for (let x = -400; x <= W + 400; x += 12) ctx.lineTo(x, ridgeY(r, x + mistShift * (i + 1) * 6));
            ctx.lineTo(W + 400, H + 400);
            ctx.closePath();
            ctx.fill();
            // mist band above each ridge
            const my = r.base - 40;
            const g = ctx.createLinearGradient(0, my - 90, 0, my + 60);
            g.addColorStop(0, "rgba(180,210,255,0)");
            g.addColorStop(0.5, `rgba(180,210,255,${0.16 - i * 0.03})`);
            g.addColorStop(1, "rgba(180,210,255,0)");
            ctx.fillStyle = g;
            ctx.fillRect(-400, my - 90, W + 800, 150);
          });
          ctx.restore();
        }

        function turbine(x, y, h, ang, col, a, bladeW = 0.035) {
          ctx.save();
          ctx.globalAlpha = a;
          ctx.fillStyle = col;
          ctx.beginPath();
          ctx.moveTo(x - h * 0.018, y);
          ctx.lineTo(x + h * 0.018, y);
          ctx.lineTo(x + h * 0.008, y - h);
          ctx.lineTo(x - h * 0.008, y - h);
          ctx.closePath();
          ctx.fill();
          ctx.beginPath();
          ctx.ellipse(x, y - h, h * 0.035, h * 0.025, 0, 0, Math.PI * 2);
          ctx.fill();
          for (let k = 0; k < 3; k++) {
            const t = ang + (k * Math.PI * 2) / 3;
            ctx.save();
            ctx.translate(x, y - h);
            ctx.rotate(t);
            ctx.beginPath();
            ctx.moveTo(0, -h * bladeW * 0.5);
            ctx.quadraticCurveTo(h * 0.3, -h * bladeW, h * 0.62, -h * 0.004);
            ctx.lineTo(h * 0.62, h * 0.004);
            ctx.quadraticCurveTo(h * 0.25, h * bladeW * 0.7, 0, h * bladeW * 0.5);
            ctx.closePath();
            ctx.fill();
            ctx.restore();
          }
          ctx.restore();
        }

        // ---------- scene 1: the breath (0 - 6) ----------
        const breath = [];
        for (let i = 0; i < 520; i++) breath.push({ a: (rand() - 0.5) * 0.7, v: 0.6 + rand() * 0.8, o: rand(), s: 1 + rand() * 2.5, w: rand() * 6.28 });
        const profile = [[0, -270], [16, -210], [30, -160], [24, -126], [52, -86], [70, -46], [44, -36], [48, -16], [36, -4], [44, 12], [30, 22], [32, 44], [12, 70], [-8, 98], [-70, 118]];
        const PX = 600,
          PY = 560,
          MOUTH = [PX + 46, PY - 8];

        function sceneBreath(t) {
          ctx.fillStyle = "#02040a";
          ctx.fillRect(0, 0, W, H);
          // mountains arrive under the exhale (camera pulls back)
          if (t > 3) {
            sky([[0, "#030818"], [0.55, "#0d2452"], [1, "#2a4d86"]].map(([o, c]) => [o, c]));
            ctx.globalAlpha = 1 - smooth(3, 4.6, t);
            ctx.fillStyle = "#02040a";
            ctx.fillRect(0, 0, W, H);
            ctx.globalAlpha = 1;
            const z = lerp(2.4, 1.0, easeOut((t - 3) / 3));
            mountains(z, smooth(3.2, 4.8, t), t);
          }
          // profile line
          const pa = smooth(0.8, 1.6, t) * (1 - smooth(3.0, 3.8, t));
          if (pa > 0) {
            ctx.save();
            ctx.globalAlpha = pa * 0.9;
            ctx.strokeStyle = C.cyan;
            ctx.lineWidth = 2.5;
            ctx.shadowColor = C.cyan;
            ctx.shadowBlur = 18;
            ctx.beginPath();
            profile.forEach(([x, y], i) => (i ? ctx.lineTo(PX + x * 1.5, PY + y * 1.5) : ctx.moveTo(PX + x * 1.5, PY + y * 1.5)));
            ctx.stroke();
            ctx.restore();
          }
          // particles: inhale (0.8-2.6) toward the mouth, exhale (2.6+) outward into mist
          ctx.save();
          ctx.globalCompositeOperation = "lighter";
          for (const p of breath) {
            let x, y, a, s;
            if (t < 2.6) {
              if (t < 0.8) continue;
              const k = ((t - 0.8) * 0.9 * p.v + p.o) % 1;
              const d = (1 - k) * 700;
              x = MOUTH[0] + Math.cos(p.a) * d * 1.3;
              y = MOUTH[1] + Math.sin(p.a) * d;
              a = Math.sin(k * Math.PI) * 0.5 * smooth(0.8, 1.5, t);
              s = p.s;
            } else {
              const age = t - 2.6 - p.o * 0.9;
              if (age < 0) continue;
              const d = age * 330 * p.v * (1 + age * 0.6);
              const z = t > 3 ? lerp(1.0, 0.45, easeOut((t - 3) / 3)) : 1;
              x = MOUTH[0] + (Math.cos(p.a * 1.6) * d + Math.sin(age * 2 + p.w) * 30 * age) * z;
              y = MOUTH[1] + (Math.sin(p.a * 1.6) * d * 0.6 - age * 40) * z;
              a = Math.exp(-age * 0.8) * 0.4 / (1 + age * 1.5);
              s = p.s * (1 + age * 1.6);
            }
            ctx.fillStyle = `rgba(200,230,255,${clamp(a).toFixed(3)})`;
            ctx.beginPath();
            ctx.arc(x, y, s, 0, Math.PI * 2);
            ctx.fill();
          }
          ctx.restore();
        }

        // ---------- scene 2: ridge, giant blade, turbine (6 - 10) ----------
        function sceneRidge(t) {
          sky([[0, "#030818"], [0.55, "#0d2452"], [1, "#2a4d86"]]);
          const push = lerp(1.0, 1.14, smooth(7.4, 10, t));
          ctx.save();
          ctx.translate(1250, 560);
          ctx.scale(push, push);
          ctx.translate(-1250, -560);
          mountains(1.0, 1, t);
          const ry = ridgeY(ridges[1], 1250 + t * 12);
          turbine(1250, ry + 10, 470, t * 1.3, "#dce7f7", 0.95);
          turbine(1560, ridgeY(ridges[0], 1560 + t * 6) + 6, 260, t * 1.25 + 1, "#9fb5d8", 0.7);
          turbine(880, ridgeY(ridges[0], 880 + t * 6) + 6, 220, t * 1.35 + 2, "#9fb5d8", 0.6);
          // tiny technician for scale
          ctx.fillStyle = "#f5b843";
          ctx.fillRect(1272, ry + 2, 3, 8);
          ctx.beginPath();
          ctx.arc(1273.5, ry, 2, 0, Math.PI * 2);
          ctx.fill();
          ctx.restore();
          // giant foreground blade sweeping the frame (6.2 - 7.7)
          const k = clamp((t - 6.2) / 1.5);
          if (k > 0 && k < 1) {
            const ang = lerp(-2.2, -0.15, k);
            for (let g = 3; g >= 0; g--) {
              const a2 = ang - g * 0.05;
              ctx.save();
              ctx.globalAlpha = g ? 0.12 : 1;
              ctx.translate(-260, 1450);
              ctx.rotate(a2);
              const gr = ctx.createLinearGradient(0, -140, 0, 140);
              gr.addColorStop(0, "#ffffff");
              gr.addColorStop(0.6, "#c9d6ea");
              gr.addColorStop(1, "#7f93b5");
              ctx.fillStyle = gr;
              ctx.beginPath();
              ctx.moveTo(0, -150);
              ctx.quadraticCurveTo(1400, -260, 2900, -18);
              ctx.lineTo(2900, 18);
              ctx.quadraticCurveTo(1300, 190, 0, 150);
              ctx.closePath();
              ctx.fill();
              ctx.restore();
            }
          }
        }

        // ---------- scene 3: fast cuts (10 - 14) ----------
        function gear(x, y, r, teeth, ang, col) {
          ctx.save();
          ctx.translate(x, y);
          ctx.rotate(ang);
          ctx.beginPath();
          for (let i = 0; i < teeth * 2; i++) {
            const a0 = (i / (teeth * 2)) * Math.PI * 2;
            const rr = i % 2 ? r : r * 1.12;
            ctx.lineTo(Math.cos(a0) * rr, Math.sin(a0) * rr);
            ctx.lineTo(Math.cos(a0 + Math.PI / teeth) * rr, Math.sin(a0 + Math.PI / teeth) * rr);
          }
          ctx.closePath();
          const g = ctx.createLinearGradient(-r, -r, r, r);
          g.addColorStop(0, "#cfdcf0");
          g.addColorStop(0.5, col);
          g.addColorStop(1, "#1a2a4a");
          ctx.fillStyle = g;
          ctx.fill();
          ctx.strokeStyle = "rgba(111,211,255,0.7)";
          ctx.lineWidth = 3;
          ctx.stroke();
          ctx.fillStyle = "#050b1d";
          ctx.beginPath();
          ctx.arc(0, 0, r * 0.28, 0, Math.PI * 2);
          ctx.fill();
          for (let s = 0; s < 6; s++) {
            ctx.save();
            ctx.rotate((s * Math.PI) / 3);
            ctx.fillStyle = "rgba(5,11,29,0.55)";
            ctx.beginPath();
            ctx.ellipse(r * 0.6, 0, r * 0.14, r * 0.09, 0, 0, Math.PI * 2);
            ctx.fill();
            ctx.restore();
          }
          ctx.restore();
        }
        const pylons = [180, 980, 1780];
        const rowTurbines = Array.from({ length: 14 }, (_, i) => ({ k: i, ph: rand() * 6.28 }));

        function sceneCuts(t) {
          const cut = Math.floor(t - 10);
          const lt = t - 10 - cut;
          if (cut === 0) {
            sky([[0, "#02040a"], [1, "#0a1a3f"]]);
            const s = 1 + lt * 0.08;
            ctx.save();
            ctx.translate(W / 2, H / 2);
            ctx.scale(s, s);
            ctx.translate(-W / 2, -H / 2);
            gear(820, 560, 300, 18, t * 1.6, "#6f86ad");
            gear(1300, 380, 190, 12, -t * 2.4 + 0.13, "#8aa0c4");
            gear(1290, 800, 150, 10, -t * 3.0 + 0.2, "#5d759e");
            glow(1060, 560, 700, "rgba(111,211,255,A)", 0.12);
            ctx.restore();
          } else if (cut === 1) {
            sky([[0, "#0a1636"], [0.7, "#29406f"], [1, "#d9894a"]]);
            ctx.fillStyle = "#050b1d";
            pylons.forEach((x) => {
              ctx.beginPath();
              ctx.moveTo(x - 60, H);
              ctx.lineTo(x - 8, 260);
              ctx.lineTo(x + 8, 260);
              ctx.lineTo(x + 60, H);
              ctx.closePath();
              ctx.fill();
              ctx.fillRect(x - 110, 280, 220, 10);
            });
            for (let c = 0; c < 3; c++) {
              const y0 = 290 + c * 3;
              ctx.strokeStyle = "#0b1430";
              ctx.lineWidth = 3;
              ctx.beginPath();
              for (let x = 0; x <= W; x += 10) {
                const seg = Math.floor((x - 180) / 800);
                const sx = 180 + seg * 800;
                const u = (x - sx) / 800;
                const sag = 160 * 4 * u * (1 - u);
                const vib = Math.sin(u * Math.PI * 6 + t * 40 + c) * 9 * Math.exp(-lt * 2) * Math.sin(u * Math.PI);
                const y = y0 + c * 70 + sag + vib;
                x ? ctx.lineTo(x, y) : ctx.moveTo(x, y);
              }
              ctx.stroke();
              // energy pulse along the cable
              const px = ((lt * 1.6 + c * 0.3) % 1) * W;
              const seg = Math.floor((px - 180) / 800);
              const u = (px - (180 + seg * 800)) / 800;
              const py = y0 + c * 70 + 160 * 4 * u * (1 - u);
              glow(px, py, 60, "rgba(245,184,67,A)", 0.9);
            }
          } else if (cut === 2) {
            sky([[0, "#0c1b40"], [0.6, "#4a6aa3"], [1, "#a9bfdf"]]);
            for (let i = rowTurbines.length - 1; i >= 0; i--) {
              const d = i / rowTurbines.length;
              const x = lerp(1820, 760, Math.pow(d, 0.7));
              const h = lerp(760, 130, Math.pow(d, 0.6));
              const y = lerp(1120, 640, Math.pow(d, 0.6));
              turbine(x, y, h, t * 1.4 + rowTurbines[i].ph, i < 3 ? "#e8eef9" : "#c6d3ea", 1 - d * 0.55);
            }
            ctx.fillStyle = "rgba(200,220,245,0.25)";
            ctx.fillRect(0, 600, W, 480);
          } else {
            sky([[0, "#0a1a3f"], [1, "#1f4fa0"]]);
            const ang = t * 7;
            for (let g = 5; g >= 0; g--) turbine(960, 1640, 1100, ang - g * 0.035, g ? "rgba(234,243,255,0.25)" : "#eaf3ff", g ? 0.4 : 1, 0.06);
            ctx.fillStyle = "#cfdcf0";
            ctx.beginPath();
            ctx.arc(960, 540, 70, 0, Math.PI * 2);
            ctx.fill();
          }
          // hard white cut flash
          if (lt < 0.07) {
            ctx.fillStyle = `rgba(255,255,255,${(0.7 * (1 - lt / 0.07)).toFixed(3)})`;
            ctx.fillRect(0, 0, W, H);
          }
        }

        // ---------- scene 4: solar wave (14 - 20) ----------
        function sceneSolar(t) {
          const lt = t - 14;
          const warm = smooth(0, 4, lt);
          sky([[0, `rgb(${lerp(8, 30, warm) | 0},${lerp(20, 50, warm) | 0},${lerp(60, 110, warm) | 0})`], [0.5, `rgb(${lerp(40, 210, warm) | 0},${lerp(70, 120, warm) | 0},${lerp(130, 80, warm) | 0})`], [0.56, "#f5c46b"], [1, "#0b1a3d"]]);
          const sunY = lerp(660, 560, easeOut(lt / 5));
          glow(960, sunY, 520, "rgba(255,210,120,A)", 0.55 + 0.25 * warm);
          ctx.fillStyle = "#fff4d0";
          ctx.beginPath();
          ctx.arc(960, sunY, 70, 0, Math.PI * 2);
          ctx.fill();
          ctx.fillStyle = "#0b1a3d";
          ctx.fillRect(0, 600, W, H - 600);
          // perspective panel field, camera skimming forward
          const HZ = 600,
            rows = 22,
            fwd = (lt * 1.6) % 1;
          for (let j = rows; j >= 0; j--) {
            const d0 = (j + 1 - fwd) / rows,
              d1 = (j + 0.45 - fwd) / rows;
            if (d1 <= 0) continue;
            const y0 = HZ + (H - HZ) * Math.pow(1 - d0, 2.4),
              y1 = HZ + (H - HZ) * Math.pow(1 - d1, 2.4);
            const spread0 = lerp(3.2, 0.2, d0),
              spread1 = lerp(3.2, 0.2, d1);
            const cols = 16;
            for (let c = 0; c < cols; c++) {
              const u0 = (c + 0.06) / cols - 0.5,
                u1 = (c + 0.94) / cols - 0.5;
              const xa = 960 + u0 * W * spread1,
                xb = 960 + u1 * W * spread1,
                xc = 960 + u1 * W * spread0,
                xd = 960 + u0 * W * spread0;
              const wave = (lt - 0.6) * 1.15 - ((c / cols) * 0.9 + (j / rows) * 0.6);
              const lit = smooth(0, 0.35, wave);
              const r = lerp(14, 255, lit),
                g = lerp(32, 205, lit),
                b = lerp(70, 120, lit);
              ctx.fillStyle = `rgb(${r | 0},${g | 0},${b | 0})`;
              ctx.beginPath();
              ctx.moveTo(xa, y1);
              ctx.lineTo(xb, y1);
              ctx.lineTo(xc, y0);
              ctx.lineTo(xd, y0);
              ctx.closePath();
              ctx.fill();
              if (lit > 0.05 && lit < 0.98) {
                ctx.fillStyle = `rgba(255,248,220,${(0.8 * Math.sin(lit * Math.PI)).toFixed(3)})`;
                ctx.fill();
              }
            }
          }
          ctx.save();
          ctx.globalCompositeOperation = "lighter";
          glow(960, 640, 900, "rgba(245,184,67,A)", 0.12 * warm);
          ctx.restore();
        }

        // ---------- scene 5: dam + runner (20 - 25) ----------
        const drops = Array.from({ length: 2000 }, () => ({ g: Math.floor(rand() * 4), x: rand(), o: rand(), v: 0.7 + rand() * 0.6, s: 1 + rand() * 2.5 }));
        function sceneDam(t) {
          const lt = t - 20;
          if (t < 23.2) {
            sky([[0, "#061233"], [0.5, "#1c3a72"], [1, "#0a1733"]]);
            // dam wall from a low angle
            ctx.fillStyle = vgrad([[0, "#9fb0c9"], [1, "#3b4c6c"]]);
            ctx.beginPath();
            ctx.moveTo(260, 130);
            ctx.quadraticCurveTo(960, 60, 1660, 130);
            ctx.lineTo(1920, 1080);
            ctx.lineTo(0, 1080);
            ctx.closePath();
            ctx.fill();
            for (let k = 1; k < 9; k++) {
              ctx.strokeStyle = "rgba(20,32,60,0.35)";
              ctx.lineWidth = 2;
              ctx.beginPath();
              ctx.moveTo(lerp(260, 0, k / 9), lerp(130, 1080, k / 9));
              ctx.quadraticCurveTo(960, lerp(60, 1000, k / 9), lerp(1660, 1920, k / 9), lerp(130, 1080, k / 9));
              ctx.stroke();
            }
            const gates = [600, 840, 1080, 1320];
            gates.forEach((gx) => {
              ctx.fillStyle = "#0a1428";
              ctx.fillRect(gx - 60, 240, 120, 90);
            });
            // slow-motion water curtains, gold-lit
            ctx.save();
            ctx.globalCompositeOperation = "lighter";
            for (const d of drops) {
              const k = (lt * 0.35 * d.v + d.o) % 1;
              const gx = gates[d.g] + (d.x - 0.5) * 110 + k * k * (d.x - 0.5) * 260;
              const gy = 330 + k * k * 900;
              const gold = d.x > 0.6;
              ctx.fillStyle = gold ? `rgba(255,214,140,${(0.7 * (1 - k)).toFixed(3)})` : `rgba(190,225,255,${(0.6 * (1 - k)).toFixed(3)})`;
              ctx.fillRect(gx, gy, d.s, d.s * (4 + k * 10));
            }
            ctx.restore();
            ctx.fillStyle = "rgba(210,230,255,0.22)";
            ctx.fillRect(0, 900, W, 180);
          } else {
            sky([[0, "#02040a"], [1, "#0a1a3f"]]);
            const ang = t * 3.2;
            ctx.save();
            ctx.translate(960, 560);
            ctx.scale(1, 0.62);
            for (let s = 0; s < 40; s++) {
              const a0 = s * 0.6 + t * 1.8;
              ctx.strokeStyle = `rgba(111,211,255,${(0.08 + (s % 5) * 0.03).toFixed(3)})`;
              ctx.lineWidth = 3;
              ctx.beginPath();
              for (let q = 0; q < 30; q++) {
                const rr = 760 - q * 22,
                  aa = a0 + q * 0.12;
                q ? ctx.lineTo(Math.cos(aa) * rr, Math.sin(aa) * rr) : ctx.moveTo(Math.cos(aa) * rr, Math.sin(aa) * rr);
              }
              ctx.stroke();
            }
            ctx.strokeStyle = "#3b4f78";
            ctx.lineWidth = 34;
            ctx.beginPath();
            ctx.arc(0, 0, 470, 0, Math.PI * 2);
            ctx.stroke();
            ctx.strokeStyle = "rgba(245,184,67,0.6)";
            ctx.lineWidth = 3;
            ctx.beginPath();
            ctx.arc(0, 0, 452, 0, Math.PI * 2);
            ctx.stroke();
            for (let b = 0; b < 11; b++) {
              ctx.save();
              ctx.rotate(ang + (b * Math.PI * 2) / 11);
              const g = ctx.createLinearGradient(0, 0, 420, 0);
              g.addColorStop(0, "#d7e2f3");
              g.addColorStop(1, "#4f668f");
              ctx.fillStyle = g;
              ctx.beginPath();
              ctx.moveTo(90, -18);
              ctx.quadraticCurveTo(270, -90, 440, -26);
              ctx.quadraticCurveTo(300, 14, 90, 18);
              ctx.closePath();
              ctx.fill();
              ctx.strokeStyle = "rgba(245,184,67,0.8)";
              ctx.lineWidth = 2;
              ctx.stroke();
              ctx.restore();
            }
            const hub = ctx.createRadialGradient(-20, -20, 10, 0, 0, 110);
            hub.addColorStop(0, "#e6eef9");
            hub.addColorStop(1, "#4f668f");
            ctx.fillStyle = hub;
            ctx.beginPath();
            ctx.arc(0, 0, 110, 0, Math.PI * 2);
            ctx.fill();
            ctx.restore();
          }
        }

        // ---------- scene 6: convergence (25 - 29.25) ----------
        const fil = Array.from({ length: 70 }, (_, i) => {
          const side = i % 4;
          const u = rand();
          const sx = side === 0 ? 0 : side === 1 ? W : u * W;
          const sy = side === 0 || side === 1 ? u * H : side === 2 ? 0 : H;
          return { sx, sy, cx: rand() * W, cy: rand() * H, o: rand() * 1.6, gold: rand() > 0.5 };
        });
        function sceneConverge(t) {
          const lt = t - 25;
          ctx.fillStyle = "#02040a";
          ctx.fillRect(0, 0, W, H);
          const close = easeIn(lt / 2.8);
          const bw = lerp(W / 3, 0, close);
          const centers = [960 - bw, 960, 960 + bw];
          const kinds = ["wind", "sun", "water"];
          const implode = clamp((t - 29.0) / 0.25);
          ctx.save();
          if (implode > 0) {
            const s = 1 - implode;
            ctx.translate(960, 540);
            ctx.scale(s, s);
            ctx.translate(-960, -540);
          }
          centers.forEach((cx, i) => {
            if (bw < 2) return;
            ctx.save();
            ctx.beginPath();
            ctx.rect(cx - bw / 2, 0, bw, H);
            ctx.clip();
            if (kinds[i] === "wind") {
              sky([[0, "#0c1b40"], [1, "#3a5f9a"]]);
              for (let k = 0; k < 4; k++) turbine(cx - bw * 0.25 + k * 120, 1000, 520 - k * 60, t * 1.6 + k, "#e8eef9", 0.9 - k * 0.15);
            } else if (kinds[i] === "sun") {
              sky([[0, "#3a2a1a"], [0.5, "#d9894a"], [1, "#2a1a10"]]);
              glow(cx, 540, 420, "rgba(255,214,140,A)", 0.9);
              for (let r = 0; r < 12; r++)
                for (let c2 = -3; c2 <= 3; c2++) {
                  ctx.fillStyle = `rgba(255,${200 + ((r * 7 + c2 * 3) % 40)},120,${(0.25 + ((r + c2 + 9) % 4) * 0.12).toFixed(2)})`;
                  ctx.fillRect(cx + c2 * 90 - 40, 620 + r * 40, 80, 30);
                }
            } else {
              sky([[0, "#06203f"], [1, "#0f4a7a"]]);
              for (let k = 0; k < 60; k++) {
                const x = cx - bw / 2 + ((k * 37) % 100) / 100 * bw;
                const y = ((t * 520 + k * 97) % (H + 200)) - 100;
                ctx.fillStyle = "rgba(160,220,255,0.55)";
                ctx.fillRect(x, y, 3, 60);
              }
            }
            ctx.restore();
          });
          // filaments of light converging on one point
          ctx.globalCompositeOperation = "lighter";
          fil.forEach((f) => {
            const p = clamp((lt - f.o) / 1.6);
            if (p <= 0) return;
            ctx.strokeStyle = f.gold ? `rgba(245,184,67,${(0.55 * p).toFixed(3)})` : `rgba(111,211,255,${(0.55 * p).toFixed(3)})`;
            ctx.lineWidth = 2.5;
            ctx.beginPath();
            const steps = 24;
            for (let s = 0; s <= steps * p; s++) {
              const u = s / steps;
              const x = (1 - u) * (1 - u) * f.sx + 2 * (1 - u) * u * f.cx + u * u * 960;
              const y = (1 - u) * (1 - u) * f.sy + 2 * (1 - u) * u * f.cy + u * u * 540;
              s ? ctx.lineTo(x, y) : ctx.moveTo(x, y);
            }
            ctx.stroke();
          });
          const core = smooth(25.5, 29.0, t);
          glow(960, 540, 120 + 380 * core, "rgba(255,240,210,A)", 0.4 + 0.6 * core);
          glow(960, 540, 30 + 60 * core, "rgba(255,255,255,A)", 1);
          ctx.globalCompositeOperation = "source-over";
          ctx.restore();
        }

        // ---------- scene 7: the city (30.6 - 35.2) ----------
        const city = [];
        for (let layer = 0; layer < 3; layer++) {
          let x = -40;
          while (x < W + 40) {
            const w = 40 + rand() * (90 - layer * 15);
            const h = (120 + rand() * 340) * (1 - layer * 0.18) + (layer === 0 && rand() > 0.8 ? 260 : 0);
            const wins = [];
            for (let wy = 14; wy < h - 10; wy += 16) for (let wx = 8; wx < w - 8; wx += 12) if (rand() > 0.25) wins.push([wx, wy, rand()]);
            city.push({ layer, x, w, h, wins });
            x += w + 4 + rand() * 10;
          }
        }
        function sceneCity(t) {
          const lt = t - 30.6;
          sky([[0, "#08122e"], [0.5, "#2b3f74"], [0.78, "#e09a52"], [1, "#2a1a14"]]);
          glow(960, 830, 900, "rgba(245,170,80,A)", 0.35);
          const orbit = lerp(1.0, 1.07, smooth(0, 4.6, lt));
          ctx.save();
          ctx.translate(960, 700);
          ctx.scale(orbit, orbit);
          ctx.translate(-960 + lt * 10, -700);
          const R = Math.pow(lt, 0.8) * 1200;
          for (let layer = 2; layer >= 0; layer--) {
            const baseY = 1000 - layer * 60;
            const shade = ["#060c1e", "#0b1530", "#142245"][layer];
            city.filter((b) => b.layer === layer).forEach((b) => {
              const top = baseY - b.h;
              ctx.fillStyle = shade;
              ctx.fillRect(b.x, top, b.w, b.h + 200);
              for (const [wx, wy, r] of b.wins) {
                const X = b.x + wx,
                  Y = top + wy;
                const d = Math.hypot(X - 960, (Y - 760) * 1.6);
                const on = clamp((R - d) / 120);
                if (on <= 0) continue;
                ctx.fillStyle = r > 0.5 ? `rgba(255,214,140,${(on * (0.6 + r * 0.4)).toFixed(3)})` : `rgba(180,225,255,${(on * 0.8).toFixed(3)})`;
                ctx.fillRect(X, Y, 6, 8);
              }
            });
          }
          // shockwave ring
          if (lt < 3) {
            ctx.globalCompositeOperation = "lighter";
            ctx.strokeStyle = `rgba(255,214,140,${(0.8 * (1 - lt / 3)).toFixed(3)})`;
            ctx.lineWidth = 10;
            ctx.beginPath();
            ctx.ellipse(960, 760, Math.max(1, R), Math.max(1, R / 1.6), 0, 0, Math.PI * 2);
            ctx.stroke();
            ctx.globalCompositeOperation = "source-over";
          }
          // traffic light trails
          for (let k = 0; k < 40; k++) {
            const y = 1010 + (k % 4) * 14;
            const x = ((lt * (300 + (k % 7) * 60) + k * 211) % (W + 200)) - 100;
            ctx.fillStyle = k % 2 ? "rgba(255,200,120,0.8)" : "rgba(255,90,80,0.7)";
            ctx.fillRect(x, y, 26, 3);
          }
          ctx.restore();
        }

        // ---------- scene 8: the child + dandelion (35.2 - 39.2) ----------
        const seeds = Array.from({ length: 64 }, (_, i) => ({ a: (i / 64) * Math.PI * 2, o: rand() * 0.8, v: 0.7 + rand() * 0.7, w: rand() * 6.28 }));
        const bokeh = Array.from({ length: 60 }, () => ({ x: rand() * W, y: 200 + rand() * 700, r: 20 + rand() * 60, gold: rand() > 0.4, a: 0.1 + rand() * 0.25 }));
        const HEAD = [700, 470];
        function seedPos(s, t) {
          const lt = t - 36.0 - s.o * 0.6;
          const hx = HEAD[0] + Math.cos(s.a) * 34,
            hy = HEAD[1] + Math.sin(s.a) * 34;
          if (lt <= 0) return { x: hx, y: hy, flying: 0 };
          const d = lt * 260 * s.v;
          return { x: hx + d * 1.15 + Math.sin(lt * 2 + s.w) * 40, y: hy - d * 0.55 - lt * lt * 30 + Math.cos(lt * 1.6 + s.w) * 25, flying: clamp(lt / 0.8) };
        }
        function miniTurbine(x, y, r, ang, a) {
          ctx.save();
          ctx.translate(x, y);
          ctx.rotate(ang);
          ctx.fillStyle = `rgba(255,226,160,${a.toFixed(3)})`;
          for (let k = 0; k < 3; k++) {
            ctx.rotate((Math.PI * 2) / 3);
            ctx.beginPath();
            ctx.ellipse(r * 0.55, 0, r * 0.55, r * 0.13, 0, 0, Math.PI * 2);
            ctx.fill();
          }
          ctx.restore();
        }
        function sceneChild(t) {
          sky([[0, "#08122e"], [0.6, "#24386a"], [1, "#3a2a40"]]);
          bokeh.forEach((b) => glow(b.x, b.y, b.r, b.gold ? "rgba(255,200,120,A)" : "rgba(140,200,255,A)", b.a));
          // balcony rail
          ctx.fillStyle = "#03060f";
          ctx.fillRect(0, 880, W, 200);
          ctx.fillRect(0, 860, W, 14);
          for (let x = 20; x < W; x += 60) ctx.fillRect(x, 870, 8, 120);
          // child silhouette
          ctx.beginPath();
          ctx.arc(560, 520, 64, 0, Math.PI * 2);
          ctx.fill();
          ctx.beginPath();
          ctx.ellipse(488, 540, 26, 44, -0.5, 0, Math.PI * 2);
          ctx.fill();
          ctx.fillRect(540, 570, 40, 50);
          ctx.beginPath();
          ctx.moveTo(450, 1080);
          ctx.quadraticCurveTo(440, 660, 520, 625);
          ctx.lineTo(600, 625);
          ctx.quadraticCurveTo(675, 660, 670, 1080);
          ctx.closePath();
          ctx.fill();
          ctx.lineWidth = 34;
          ctx.lineCap = "round";
          ctx.strokeStyle = "#03060f";
          ctx.beginPath();
          ctx.moveTo(620, 680);
          ctx.quadraticCurveTo(690, 640, 690, 560);
          ctx.stroke();
          // dandelion
          ctx.strokeStyle = "#5c7a4a";
          ctx.lineWidth = 4;
          ctx.beginPath();
          ctx.moveTo(690, 575);
          ctx.lineTo(HEAD[0], HEAD[1] + 8);
          ctx.stroke();
          ctx.save();
          ctx.globalCompositeOperation = "lighter";
          seeds.forEach((s) => {
            const p = seedPos(s, t);
            if (!p.flying) {
              ctx.strokeStyle = "rgba(240,240,230,0.85)";
              ctx.lineWidth = 1.5;
              ctx.beginPath();
              ctx.moveTo(HEAD[0], HEAD[1]);
              ctx.lineTo(p.x, p.y);
              ctx.stroke();
              ctx.fillStyle = "rgba(255,255,245,0.9)";
              ctx.beginPath();
              ctx.arc(p.x, p.y, 3, 0, Math.PI * 2);
              ctx.fill();
            } else {
              glow(p.x, p.y, 26, "rgba(255,210,130,A)", 0.5 * p.flying);
              miniTurbine(p.x, p.y, 7 + p.flying * 7, t * 6 + s.w, 0.95);
            }
          });
          ctx.restore();
        }

        // ---------- scene 9: logo (39.2 - 45) ----------
        function sceneLogo(t) {
          sky([[0, "#050b1d"], [0.62, "#0d2452"], [1, "#4a3a2a"]]);
          glow(960, 400, 600, "rgba(245,184,67,A)", 0.18 * smooth(39.8, 41.5, t));
          const k = easeOut((t - 39.2) / 1.4);
          ctx.save();
          ctx.globalCompositeOperation = "lighter";
          seeds.forEach((s, i) => {
            const from = seedPos(s, 39.2);
            const a = (i / seeds.length) * Math.PI * 2 + t * 0.15;
            const tx = 960 + Math.cos(a) * 120,
              ty = 400 + Math.sin(a) * 120;
            const x = lerp(from.x, tx, k),
              y = lerp(from.y, ty, k);
            glow(x, y, 22, "rgba(255,210,130,A)", 0.4);
            miniTurbine(x, y, lerp(14, 6, k), t * 4 + s.w, 0.9);
          });
          ctx.restore();
          // emblem: ring + turbine mark
          const e = smooth(40.0, 40.8, t);
          if (e > 0) {
            ctx.save();
            ctx.globalAlpha = e;
            ctx.strokeStyle = "#f5b843";
            ctx.lineWidth = 6;
            ctx.beginPath();
            ctx.arc(960, 400, 132, 0, Math.PI * 2);
            ctx.stroke();
            ctx.translate(960, 400);
            ctx.rotate(t * 0.6);
            ctx.fillStyle = "#f3f8ff";
            for (let b = 0; b < 3; b++) {
              ctx.rotate((Math.PI * 2) / 3);
              ctx.beginPath();
              ctx.moveTo(0, -9);
              ctx.quadraticCurveTo(50, -22, 98, -2);
              ctx.lineTo(98, 2);
              ctx.quadraticCurveTo(45, 14, 0, 9);
              ctx.closePath();
              ctx.fill();
            }
            ctx.beginPath();
            ctx.arc(0, 0, 14, 0, Math.PI * 2);
            ctx.fill();
            ctx.restore();
          }
        }

        // ---------- dispatcher with crossfades ----------
        const scenes = [
          [0, 6.0, sceneBreath],
          [6.0, 10.0, sceneRidge],
          [10.0, 14.0, sceneCuts],
          [14.0, 20.0, sceneSolar],
          [20.0, 25.0, sceneDam],
          [25.0, 29.25, sceneConverge],
          [30.6, 35.2, sceneCity],
          [35.2, 39.2, sceneChild],
          [39.2, 45.01, sceneLogo],
        ];
        const XF = { 14.0: 0.5, 20.0: 0.4, 35.2: 0.6, 39.2: 0.5 }; // crossfade lengths (others are hard cuts)
        // second buffer for crossfades: draw the outgoing scene, then the incoming one over it
        const buf = document.createElement("canvas");
        buf.width = W;
        buf.height = H;
        const bctx = buf.getContext("2d");
        function render(t) {
          const cur = scenes.find(([a, b]) => t >= a && t < b);
          ctx.globalAlpha = 1;
          ctx.globalCompositeOperation = "source-over";
          if (!cur) {
            ctx.fillStyle = "#000000";
            ctx.fillRect(0, 0, W, H);
            return;
          }
          const xf = XF[cur[0]];
          const idx = scenes.indexOf(cur);
          if (xf && t < cur[0] + xf && idx > 0) {
            const prev = scenes[idx - 1];
            prev[2](Math.min(t, prev[1] - 0.001));
            bctx.clearRect(0, 0, W, H);
            bctx.drawImage(cv, 0, 0);
            cur[2](t);
            ctx.save();
            ctx.globalAlpha = 1 - (t - cur[0]) / xf;
            ctx.drawImage(buf, 0, 0);
            ctx.restore();
          } else {
            cur[2](t);
          }
        }

        const clock = { t: 0 };
        render(0);
        tl.fromTo(clock, { t: 0 }, { t: DUR, duration: DUR, ease: "none", onUpdate: () => render(clock.t) }, 0);

        // ---------- DOM: captions, flash, brand ----------
        const subs = [["#c1", 6.7, 2.3], ["#c2", 14.6, 1.4], ["#c3", 16.3, 1.5], ["#c4", 18.1, 1.4], ["#c5", 20.8, 2.1], ["#c6", 27.0, 2.0], ["#c7", 35.6, 3.5]];
        subs.forEach(([id, s, d]) => {
          tl.fromTo(id, { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.35, ease: "power2.out" }, s);
          tl.to(id, { opacity: 0, duration: 0.3, ease: "power1.in" }, s + d - 0.32);
        });
        tl.fromTo("#flash", { opacity: 0 }, { opacity: 1, duration: 0.08, ease: "none" }, 30.55);
        tl.to("#flash", { opacity: 0, duration: 0.7, ease: "power2.out" }, 30.65);
        tl.fromTo("#brand-cio", { opacity: 0, y: 30, scale: 1.08 }, { opacity: 1, y: 0, scale: 1, duration: 0.8, ease: "power3.out" }, 40.45);
        tl.fromTo("#brand-energie", { opacity: 0, y: 16 }, { opacity: 1, y: 0, duration: 0.7, ease: "power3.out" }, 40.75);
        tl.fromTo("#tagline", { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.8, ease: "power2.out" }, 42.35);

        window.__timelines["main"] = tl;
      })();
    </script>
  </body>
</html>
